name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: xcodebuild -version && swift --version

      - name: Start fake robot
        run: |
          python3 -m venv /tmp/fake && /tmp/fake/bin/pip install -q websockets
          nohup /tmp/fake/bin/python tools/fake_robot.py > fake_robot.log 2>&1 &
          for i in $(seq 1 20); do nc -z 127.0.0.1 9002 && exit 0; sleep 0.5; done
          cat fake_robot.log; exit 1

      - name: Test NarwalKit (unit + end-to-end against the fake robot)
        working-directory: NarwalKit
        env:
          NARWAL_FAKE_ROBOT: 127.0.0.1
        run: swift test

      - name: Fake robot log
        if: always()
        run: cat fake_robot.log || true

      - name: Generate Xcode project
        working-directory: App
        run: |
          brew install xcodegen
          xcodegen

      # Unsigned on purpose: sign the IPA with Signulous (or any signer).
      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project App/NarwalLocal.xcodeproj \
            -scheme NarwalLocal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NarwalLocal.app Payload/
          zip -qry NarwalLocal.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NarwalLocal-ipa
          path: NarwalLocal.ipa
